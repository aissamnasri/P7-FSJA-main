name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - master

jobs:

  ci:
    name: Build, Test & SonarQube
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================
      # FRONTEND - ANGULAR
      # ==========================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci

      - name: Build Angular
        working-directory: front
        run: npm run build

      - name: Run Angular tests with coverage
        working-directory: front
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox --code-coverage

      - name: Check Angular coverage
        run: |
          echo "===== Angular Coverage ====="
          ls -la front/coverage/microcrm/
          test -f front/coverage/microcrm/lcov.info


      # ==========================================
      # BACKEND - SPRING BOOT
      # ==========================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant Gradle permission
        working-directory: back
        run: chmod +x gradlew

      - name: Build and test backend with JaCoCo
        working-directory: back
        run: ./gradlew clean test jacocoTestReport build

      - name: Check JaCoCo report
        run: |
          echo "===== Backend Coverage ====="
          ls -la back/build/reports/jacoco/test/
          test -f back/build/reports/jacoco/test/jacocoTestReport.xml


      # ==========================================
      # SONARQUBE CLOUD
      # ==========================================

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}